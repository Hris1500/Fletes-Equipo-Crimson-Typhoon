
<section class="vista-unidades" x-data="vistaUnidades()">
    <div class="header-vista">
        <input
            type="search"
            placeholder="Buscar por placas o tipo de unidad..."
            aria-label="Buscar por placas o tipo de unidad..."
            x-model="busqueda"
        >

        <button
            class="boton-primario"
            type="button"
            @click="abrirFormulario()"
        >
            Nueva unidad
        </button>
    </div>

    <p class="mensaje-carga" x-show="cargando">Cargando unidades...</p>
    <p class="mensaje-error" x-show="error" x-text="error" role="alert"></p>
    <p class="mensaje-exito" x-show="mensaje" x-text="mensaje" role="status"></p>

    <div class="tabla-scroll">
    <table class="tabla-acciones">
        <thead>
            <tr>
                <th>ID</th>
                <th>Placas</th>
                <th>Tipo</th>
                <th>Capacidad (kg)</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <template
                x-for="unidad in filtrados"
                :key="unidad.id_unidad"
            >
                <tr>
                    <td x-text="unidad.id_unidad"></td>
                    <td x-text="unidad.placas"></td>
                    <td x-text="unidad.tipo || 'Sin especificar'"></td>
                    <td x-text="unidad.capacidad_kg ?? 'Sin especificar'"></td>
                    <td><span class="estatus" :class="Number(unidad.activa) === 1 ? 'activo' : 'inactivo'" x-text="Number(unidad.activa) === 1 ? 'Activa' : 'Inactiva'"></span></td>

                    <td>
                        <button
                            type="button"
                            class="boton-tabla"
                            @click="abrirFormulario(unidad)"
                        >
                            Editar
                        </button>
                    </td>
                </tr>
            </template>

            <tr x-show="!cargando && filtrados.length === 0">
                <td colspan="6">No se encontraron unidades.</td>
            </tr>
        </tbody>
    </table>
    </div>

    <form
        class="formulario"
        x-show="formularioAbierto"
        x-cloak
        @submit.prevent="guardar()"
    >
        <h3 x-text="formulario.id_unidad ? 'Editar unidad' : 'Registrar unidad'"></h3>

        <div class="campo">
            <label for="unidad-placas">Placas</label>
            <input
                id="unidad-placas"
                type="text"
                x-model="formulario.placas"
                required
            >
        </div>

        <div class="campo">
            <label for="unidad-tipo">Tipo de unidad</label>
            <select id="unidad-tipo" x-model="formulario.tipo" required>
                <option value="">Selecciona un tipo</option>
                <option value="Pickup">Pickup</option>
                <option value="Camioneta">Camioneta</option>
                <option value="Rabón">Rabón</option>
                <option value="Torton">Torton</option>
                <option value="Tráiler">Tráiler</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

        <div class="campo">
            <label for="unidad-capacidad">Capacidad en kilogramos</label>
            <input
                id="unidad-capacidad"
                type="number"
                min="0.01"
                step="0.01"
                x-model="formulario.capacidad_kg"
                required
            >
        </div>

        <label class="campo-check">
            <input type="checkbox" x-model="formulario.activa">
            Unidad activa
        </label>

        <div class="form-acciones">
            <button type="button" @click="cerrarFormulario()">
                Cancelar
            </button>

            <button type="submit" class="boton-primario" :disabled="guardando">
                <span x-text="guardando ? 'Guardando...' : 'Guardar'"></span>
            </button>
        </div>

        <p class="mensaje-error" x-show="errorFormulario" x-text="errorFormulario" role="alert"></p>
    </form>
</section>
