<section class="dashboard" x-data="vistaDashboard()">
    <div class="dashboard-intro">   
        <div>
            <h2>Resumen de operaciones</h2>
            <p>Consulta el estado general de tus fletes.</p>
        </div>
        <button type="button" @click="cargar()" :disabled="cargando">
            <span x-text="cargando ? 'Actualizando…' : 'Actualizar'"></span>
        </button>
    </div>

    <p class="mensaje-error" x-show="error" x-text="error" role="alert"></p>
    <p class="mensaje-carga" x-show="cargando && !registros.length">Cargando resumen…</p>

    <div class="estadisticas">
        <article class="estadistica">
            <h3>Fletes registrados</h3>
            <p x-text="registros.length"></p>
        </article>
        <article class="estadistica">
            <h3>Pendientes de pago</h3>
            <p x-text="pendientes.length"></p>
        </article>
        <article class="estadistica">
            <h3>Total por cobrar</h3>
            <p x-text="formatearMonto(totalPendiente)"></p>
        </article>
    </div>

    <div class="dashboard-listado">
        <h2>Fletes recientes</h2>
        <p x-show="!cargando && !error && !registros.length">
            Todavía no hay fletes registrados.
        </p>
        <div class="tabla-scroll" x-show="registros.length">
            <table class="tabla-recientes">
                <thead>
                    <tr>
                        <th>Flete</th>
                        <th>Cliente</th>
                        <th>Ruta</th>
                        <th>Pago</th>
                        <th class="cifra">Monto</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="flete in registros.slice(0, 5)">
                        <tr>
                            <td x-text="flete.id_flete"></td>
                            <td x-text="flete.cliente"></td>
                            <td x-text="flete.origen + ' - ' + flete.destino"></td>
                            <td><span class="estatus" :class="Number(flete.pagado) === 1 ? 'pagado' : 'por-pagar'" x-text="etiquetaPago(flete.pagado)"></span></td>
                            <td class="sin-salto cifra" x-text="formatearMonto(flete.monto)"></td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
        <button type="button" class="dashboard-enlace"
                @click="cambiar_vista('fletes')">
            Ver todos los fletes
        </button>
    </div>
</section>
