
<section class="vista-clientes" x-data="vistaClientes()">
    <div class="header-vista">
        <input
            type="search"
            placeholder="Buscar cliente por nombre, teléfono o correo..."
            aria-label="Buscar cliente por nombre, teléfono o correo..."
            x-model="busqueda"
        >

        <button
            class="boton-primario"
            type="button"
            @click="abrirFormulario()"
        >
            Nuevo cliente
        </button>
    </div>

    <p class="mensaje-carga" x-show="cargando">Cargando clientes...</p>
    <p class="mensaje-error" x-show="error" x-text="error" role="alert"></p>
    <p class="mensaje-exito" x-show="mensaje" x-text="mensaje" role="status"></p>

    <div class="tabla-scroll">
    <table class="tabla-acciones">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th>Dirección</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <template
                x-for="cliente in filtrados"
                :key="cliente.id_cliente"
            >
                <tr>
                    <td x-text="cliente.id_cliente"></td>
                    <td x-text="cliente.nombre"></td>
                    <td x-text="cliente.telefono || 'Sin teléfono'"></td>
                    <td x-text="cliente.correo || 'Sin correo'"></td>
                    <td x-text="cliente.direccion || 'Sin dirección'"></td>
                    <td><span class="estatus" :class="Number(cliente.activo) === 1 ? 'activo' : 'inactivo'" x-text="Number(cliente.activo) === 1 ? 'Activo' : 'Inactivo'"></span></td>

                    <td>
                        <button
                            type="button"
                            class="boton-tabla"
                            @click="abrirFormulario(cliente)"
                        >
                            Editar
                        </button>
                    </td>
                </tr>
            </template>

            <tr x-show="!cargando && filtrados.length === 0">
                <td colspan="7">No se encontraron clientes.</td>
            </tr>
        </tbody>
    </table>
    </div>

    <form
        class="formulario"
        x-show="formularioAbierto"
        x-cloak
        @submit.prevent="guardar()"
    >
        <h3 x-text="formulario.id_cliente ? 'Editar cliente' : 'Registrar cliente'"></h3>

        <div class="campo">
            <label for="cliente-nombre">Nombre</label>
            <input
                id="cliente-nombre"
                type="text"
                x-model="formulario.nombre"
                required
            >
        </div>

        <div class="campo">
            <label for="cliente-telefono">Teléfono</label>
            <input
                id="cliente-telefono"
                type="tel"
                x-model="formulario.telefono"
            >
        </div>

        <div class="campo">
            <label for="cliente-correo">Correo electrónico</label>
            <input
                id="cliente-correo"
                type="email"
                x-model="formulario.correo"
            >
        </div>

        <div class="campo campo-ancho">
            <label for="cliente-direccion">Dirección</label>
            <textarea
                id="cliente-direccion"
                x-model="formulario.direccion"
            ></textarea>
        </div>

        <label class="campo-check">
            <input type="checkbox" x-model="formulario.activo">
            Cliente activo
        </label>

        <div class="form-acciones">
            <button type="button" @click="cerrarFormulario()">
                Cancelar
            </button>

            <button type="submit" class="boton-primario" :disabled="guardando">
                <span x-text="guardando ? 'Guardando...' : 'Guardar'"></span>
            </button>
        </div>

        <p class="mensaje-error" x-show="errorFormulario" x-text="errorFormulario" role="alert"></p>
    </form>
</section>
