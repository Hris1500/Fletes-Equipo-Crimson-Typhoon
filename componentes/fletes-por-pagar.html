
<section class="vista-fletes-por-pagar" x-data="vistaFletesPorPagar">
    <div class="header-vista">
        <input
            type="search"
            placeholder="Buscar por cliente, chofer, placas u origen..."
            x-model="busqueda"
        >

        <button
            type="button"
            @click="cargarFletes()"
            :disabled="cargando"
        >
            Actualizar
        </button>
    </div>

    <p x-show="cargando">Cargando fletes por pagar...</p>
    <p x-show="error" x-text="error"></p>
    <p x-show="mensaje" x-text="mensaje"></p>

    <section class="resumen-pagos">
        <h3>Saldo pendiente total</h3>
        <p
            x-text="new Intl.NumberFormat('es-MX', {
                style: 'currency',
                currency: 'MXN'
            }).format(totalPendiente)"
        ></p>

        <p>
            Fletes pendientes:
            <strong x-text="fletes.length"></strong>
        </p>
    </section>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Chofer</th>
                <th>Unidad</th>
                <th>Origen</th>
                <th>Destino</th>
                <th>Fecha de salida</th>
                <th>Monto pendiente</th>
                <th>Estatus del flete</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <template
                x-for="flete in fletesFiltrados"
                :key="flete.id_flete"
            >
                <tr>
                    <td x-text="flete.id_flete"></td>
                    <td x-text="flete.cliente"></td>
                    <td x-text="flete.chofer"></td>
                    <td x-text="flete.placas"></td>
                    <td x-text="flete.origen"></td>
                    <td x-text="flete.destino"></td>
                    <td x-text="flete.fecha_salida || 'Sin fecha'"></td>
                    <td x-text="formatearMonto(flete.monto)"></td>
                    <td x-text="({
                        pendiente: 'Pendiente',
                        en_transito: 'En tránsito',
                        finalizado: 'Finalizado'
                    })[flete.estatus] || flete.estatus"></td>

                    <td>
                        <button
                            type="button"
                            @click="registrarPago(flete)"
                            :disabled="procesandoPago !== null"
                        >
                            <span
                                x-text="procesandoPago === flete.id_flete
                                    ? 'Registrando...'
                                    : 'Registrar pago'"
                            ></span>
                        </button>
                    </td>
                </tr>
            </template>

            <tr x-show="!cargando && fletesFiltrados.length === 0">
                <td colspan="10">No hay fletes pendientes de pago.</td>
            </tr>
        </tbody>
    </table>
</section>
