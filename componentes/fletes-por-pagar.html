
<section class="vista-fletes-por-pagar" x-data="vistaFletesPorPagar()">
    <div class="header-vista">
        <input
            type="search"
            placeholder="Buscar por cliente, chofer, placas u origen..."
            aria-label="Buscar por cliente, chofer, placas u origen..."
            x-model="busqueda"
        >

        <button
            type="button"
            @click="cargar()"
            :disabled="cargando"
        >
            Actualizar
        </button>
    </div>

    <p class="mensaje-carga" x-show="cargando">Cargando fletes por pagar...</p>
    <p class="mensaje-error" x-show="error" x-text="error" role="alert"></p>
    <p class="mensaje-exito" x-show="mensaje" x-text="mensaje" role="status"></p>

    <div class="estadisticas">
        <article class="estadistica">
            <h3>Saldo pendiente total</h3>
            <p x-text="formatearMonto(totalPendiente)"></p>
        </article>
        <article class="estadistica">
            <h3>Fletes pendientes</h3>
            <p x-text="registros.length"></p>
        </article>
    </div>

    <div class="tabla-scroll">
    <table class="tabla-acciones">
        <thead>
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Chofer</th>
                <th>Unidad</th>
                <th>Origen</th>
                <th>Destino</th>
                <th>Fecha de salida</th>
                <th class="cifra">Monto pendiente</th>
                <th>Estatus del flete</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <template
                x-for="flete in filtrados"
                :key="flete.id_flete"
            >
                <tr>
                    <td x-text="flete.id_flete"></td>
                    <td x-text="flete.cliente"></td>
                    <td x-text="flete.chofer"></td>
                    <td class="sin-salto" x-text="flete.placas"></td>
                    <td x-text="flete.origen"></td>
                    <td x-text="flete.destino"></td>
                    <td class="sin-salto" x-text="flete.fecha_salida || 'Sin fecha'"></td>
                    <td class="sin-salto cifra" x-text="formatearMonto(flete.monto)"></td>
                    <td><span class="estatus" :class="flete.estatus" x-text="etiquetaEstatus(flete.estatus)"></span></td>

                    <td>
                        <button
                            type="button"
                            class="boton-tabla"
                            @click="registrarPago(flete)"
                            :disabled="procesandoPago !== null"
                        >
                            <span
                                x-text="procesandoPago === flete.id_flete
                                    ? 'Registrando...'
                                    : 'Registrar pago'"
                            ></span>
                        </button>
                    </td>
                </tr>
            </template>

            <tr x-show="!cargando && filtrados.length === 0">
                <td colspan="10">No hay fletes pendientes de pago.</td>
            </tr>
        </tbody>
    </table>
    </div>
</section>
