
<section class="vista-choferes" x-data="vistaChoferes()">

    <div class="header-vista">


        <input
            type="search"
            placeholder="Buscar por nombre o licencia..."
            aria-label="Buscar por nombre o licencia..."
            x-model="busqueda"
        >
        <button class="boton-primario" type="button" @click="abrirFormulario()">
            Nuevo chofer
        </button>
    </div>




    <p class="mensaje-carga" x-show="cargando">Cargando choferes...</p>
    <p class="mensaje-error" x-show="error" x-text="error" role="alert"></p>
    <p class="mensaje-exito" x-show="mensaje" x-text="mensaje" role="status"></p>

    <div class="tabla-scroll">
    <table class="tabla-acciones">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Licencia</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <template
                x-for="chofer in filtrados"
                :key="chofer.id_chofer"
            >
                <tr>
                    <td x-text="chofer.id_chofer"></td>
                    <td x-text="chofer.nombre"></td>
                    <td x-text="chofer.telefono || 'Sin teléfono'"></td>
                    <td x-text="chofer.num_licencia"></td>
                    <td><span class="estatus" :class="Number(chofer.activo) === 1 ? 'activo' : 'inactivo'" x-text="Number(chofer.activo) === 1 ? 'Activo' : 'Inactivo'"></span></td>
                    <td>
                        <button
                            type="button"
                            class="boton-tabla"
                            @click="abrirFormulario(chofer)"
                        >
                            Editar
                        </button>
                    </td>
                </tr>
            </template>

            <tr x-show="!cargando && filtrados.length === 0">
                <td colspan="6">No se encontraron choferes.</td>
            </tr>
        </tbody>
    </table>
    </div>

    <form
        class="formulario"
        x-show="formularioAbierto"
        x-cloak
        @submit.prevent="guardar()"
    >
        <h3 x-text="formulario.id_chofer ? 'Editar chofer' : 'Registrar chofer'"></h3>

        <div class="campo">
            <label for="chofer-nombre">Nombre completo</label>
            <input
                id="chofer-nombre"
                type="text"
                x-model="formulario.nombre"
                required
            >
        </div>

        <div class="campo">
            <label for="chofer-telefono">Teléfono</label>
            <input
                id="chofer-telefono"
                type="tel"
                x-model="formulario.telefono"
            >
        </div>

        <div class="campo">
            <label for="chofer-licencia">Número de licencia</label>
            <input
                id="chofer-licencia"
                type="text"
                x-model="formulario.num_licencia"
                required
            >
        </div>

        <label class="campo-check">
            <input type="checkbox" x-model="formulario.activo">
            Chofer activo
        </label>

        <div class="form-acciones">
            <button type="button" @click="cerrarFormulario()">
                Cancelar
            </button>

            <button type="submit" class="boton-primario" :disabled="guardando">
                <span x-text="guardando ? 'Guardando...' : 'Guardar'"></span>
            </button>
        </div>

        <p class="mensaje-error" x-show="errorFormulario" x-text="errorFormulario" role="alert"></p>
    </form>

</section>
