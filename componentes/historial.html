<section class="vista-historial" x-data="vistaHistorial" x-init="init()">

    <div class="header-vista">
        <input
            type="search"
            placeholder="Buscar por cliente, chofer, placas, origen o destino..."
            x-model="busqueda"
        >

        <div class="filtros-historial">
            <label>
                Desde
                <input type="date" x-model="filtros.desde">
            </label>

            <label>
                Hasta
                <input type="date" x-model="filtros.hasta">
            </label>

            <label>
                Estatus
                <select x-model="filtros.estatus">
                    <option value="">Todos</option>
                    <option value="finalizado">Finalizado</option>
                    <option value="en_transito">En tránsito</option>
                    <option value="pendiente">Pendiente</option>
                </select>
            </label>

            <button
                type="button"
                @click="cargarHistorial()"
                :disabled="cargando"
            >
                <span x-text="cargando ? 'Actualizando...' : 'Actualizar'"></span>
            </button>

            <button type="button" @click="limpiarFiltros()">
                Limpiar
            </button>
        </div>
    </div>

    <p x-show="cargando">Cargando historial de fletes...</p>
    <p x-show="error" x-text="error"></p>
    <p x-show="mensaje" x-text="mensaje"></p>

    <section class="kpis-contenedor">
        <div class="tarjeta-kpi">
            <h3>Fletes registrados</h3>
            <p x-text="historialFiltrado.length"></p>
        </div>

        <div class="tarjeta-kpi">
            <h3>Monto total</h3>
            <p x-text="formatearMonto(totalMonto)"></p>
        </div>

        <div class="tarjeta-kpi">
            <h3>Pagados</h3>
            <p x-text="totalPagados"></p>
        </div>

        <div class="tarjeta-kpi">
            <h3>Pendientes de pago</h3>
            <p x-text="totalSinPagar"></p>
        </div>
    </section>

    <table class="tabla-dashboard">
        <thead>
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Chofer</th>
                <th>Unidad</th>
                <th>Origen</th>
                <th>Destino</th>
                <th>Fecha de salida</th>
                <th>Fecha de entrega</th>
                <th>Monto</th>
                <th>Pagado</th>
                <th>Estatus</th>
            </tr>
        </thead>

        <tbody>
            <template
                x-for="flete in historialFiltrado"
                :key="flete.id_flete"
            >
                <tr>
                    <td x-text="flete.id_flete"></td>
                    <td x-text="flete.cliente"></td>
                    <td x-text="flete.chofer"></td>
                    <td x-text="flete.placas"></td>
                    <td x-text="flete.origen"></td>
                    <td x-text="flete.destino"></td>
                    <td x-text="flete.fecha_salida || 'Sin fecha'"></td>
                    <td x-text="flete.fecha_entrega || 'Sin fecha'"></td>
                    <td x-text="formatearMonto(flete.monto)"></td>
                    <td>
                        <span
                            class="estatus-dot"
                            :class="Number(flete.pagado) === 1 ? 'finalizado' : 'pendiente'"
                            aria-hidden="true"
                        ></span>
                        <span x-text="Number(flete.pagado) === 1 ? 'Sí' : 'No'"></span>
                    </td>
                    <td>
                        <span class="celda-estatus">
                            <span
                            class="estatus-dot"
                            :class="flete.estatus"
                            aria-hidden="true"
                            ></span>
                            <span
                            x-text="({
                                pendiente: 'Pendiente',
                                en_transito: 'En tránsito',
                                finalizado: 'Finalizado'
                            })[flete.estatus] || flete.estatus"
                            ></span>
                        </span>
                    </td>
                </tr>
            </template>

            <tr x-show="!cargando && historialFiltrado.length === 0">
                <td colspan="11">No hay fletes en el historial con esos filtros.</td>
            </tr>
        </tbody>
    </table>
</section>
